name: visa_recon_mobile
description: تطبيق رقابة الفيزا والكاش للموبايل مع دعم أوفلاين
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.0

  # State
  provider: ^6.1.2

  # UI & Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2

  # السيستم كله جوه التطبيق + مشاركة الصور وملفات Excel
  # (الإصدارات متثبتة على اللي بيشتغل مع Flutter 3.24.5 و AGP 8.1 و Kotlin 1.8.22)
  webview_flutter: 4.9.0
  webview_flutter_android: ">=3.16.0 <4.0.0"
  share_plus: ^7.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
